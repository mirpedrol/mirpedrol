name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *" # every day at 3am
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&hide_border=true&hide=stars&show_icons=true&theme=transparent"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
            
      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&hide_border=true&layout=compact&theme=transparent&count_weight=0.5&hide=html,php"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
            git config user.name "${{ github.actor }}"
            git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
            git add profile/*.svg
            git commit -m "Update README cards" || exit 0
            git push